environment: &env "development"

defaults:
  retry: &retry_defaults
    retry_attempts: 3
    retry_delay_seconds: 30
    retry_backoff_multiplier: 2.0

  db_connection: &db_defaults
    pool_min: 2
    pool_max: 10
    pool_timeout: 30
    connect_timeout: 10
    ssl_mode: "require"

  storage_zones: &storage_zones
    raw: "raw-zone"
    curated: "curated-zone"
    processed: "processed-zone"

  warehouse_defaults: &warehouse_defaults
    connect_timeout: 10
    query_timeout: 300
    load_strategy: "upsert"

data_sources:
  core_banking_db:
    <<: *db_defaults
    host: "${CORE_BANKING_HOST}"
    port: 5432
    database: "core_banking"
    schema: "public"
    username: "${DB_USER}"
    password: "${DB_PASS}"

  scylladb:
    hosts: ["${SCYLLA_NODE1}", "${SCYLLA_NODE2}"]
    port: 9042
    keyspace: "${SCYLLA_KEYSPACE}"
    username: "${SCYLLA_USER}"
    password: "${SCYLLA_PASS}"
    replication_factor: 3

data_storage:
  zones: *storage_zones
  azure:
    account_name: "${AZURE_STORAGE_ACCOUNT}"
    connection_string: "${AZURE_CONN_STRING}"

data_warehouse:
  apache_doris:
      <<: *warehouse_defaults
      host: "${DORIS_HOST}"
      mysql_port: 9030
      http_port: 8030
      database: "banking_analytics"
      username: "${DORIS_USER}"
      password: "${DORIS_PASS}"

pipeline:
  <<: *retry_defaults
  batch_size: 50000
  parallelism: 4
  load_strategy: "incremental"
  watermark_column: "updated_at"
  lookback_days: 3
  file_formats:
    raw_input: ["csv", "json", "parquet"]
    output: "parquet"

data_quality:
  null_threshold: 0.01
  duplicate_check: true
  schema_validation: true
  referential_integrity: true
  alert_on_breach: true

spark:
  app_name: "SABankingETL"
  master: "yarn"
  executor_memory: "4g"
  driver_memory: "2g"
  executor_cores: 2
  shuffle_partitions: "auto"
  adaptive_query_execution: true

overrides:
  production:
    spark:
      executor_memory: "16g"
      driver_memory: "8g"
    pipeline:
      parallelism: 16
      batch_size: 200000
  development:
    spark:
      executor_memory: "1g"
      driver_memory: "512m"
    pipeline:
      batch_size: 1000

monitoring:
  log_level: "INFO"
  prometheus_port: 8000
  alert_on_failure: true
  slack_webhook: "${SLACK_WEBHOOK_URL}"
  sla_minutes: 60
